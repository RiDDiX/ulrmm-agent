name: Run tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: Build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/386 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/386 freebsd/amd64 freebsd/arm64; do
            echo "build $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w" -o /dev/null .
          done

      - name: Vet
        run: |
          for os in linux darwin windows freebsd; do
            GOOS=$os go vet ./...
          done

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Test 32-bit
        run: GOARCH=386 CGO_ENABLED=0 go test ./...

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

      - name: Compile the Windows installer script
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nsis
          printf 'MZ' > agent.exe
          build() { LC_ALL=C.UTF-8 makensis -V2 -WX -INPUTCHARSET UTF8 "-DOutFile=$RUNNER_TEMP/agent-windows.exe" "$@" build/setup.nsi; }
          build
          # without a URL the three link values are removed from the uninstall entry, with one they are written
          empty=$(build -V4) url=$(build -V4 -DMyAppURL=https://example.com/)
          for v in URLInfoAbout HelpLink URLUpdateInfo; do
            grep -qx "DeleteRegValue: HKLM\\\\.*\\\\$v" <<<"$empty" && ! grep -q "^WriteRegStr: .*\\\\$v=" <<<"$empty" &&
              grep -qx "WriteRegStr: HKLM\\\\.*\\\\$v=https://example.com/" <<<"$url" && ! grep -q "^DeleteRegValue: .*\\\\$v\$" <<<"$url" ||
              { echo "link value $v"; exit 1; }
          done
          # the uninstaller removes the program directory: these values must stop the build
          for d in MyAppProgDir= MyAppProgDir=. 'MyAppProgDir=. .' 'MyAppProgDir=a\b' MyAppProgDir=a/b MyAppProgDir=C: \
            'MyAppProgDir=$R1' 'MyAppProgDir=a$$$b' MyAppExeName= MyAppExeName=. 'MyAppExeName=..\x.exe' \
            MyAppSvcName= 'MyAppSvcName=$0' MyAppRegKey= 'MyAppRegKey=$R0' MyAppId= 'MyAppId=$9'; do
            if out=$(build "-D$d" 2>&1); then echo "built with -D$d"; exit 1; fi
            grep -q '^!error: ' <<<"$out" || { echo "-D$d: $out"; exit 1; }
          done
          # names an installation may already have must keep building
          for d in 'MyAppProgDir=Acme Inc.' 'MyAppProgDir= Acme' MyAppProgDir=Acme..Inc 'MyAppProgDir=$$R1' \
            'MyAppExeName=agent.exe.' 'MyAppRegKey=Acme\Agent'; do
            build "-D$d" >/dev/null || { echo "failed with -D$d"; exit 1; }
          done
